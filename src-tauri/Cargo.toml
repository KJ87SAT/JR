[package]
name = "jr-receiver-desktop"
version.workspace = true
authors.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "jr_receiver_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

# SoapySDR is a desktop-only native dependency. Android receives IQ through the
# pure-Rust RTL-TCP input (a local rtl_tcp driver app, or another machine).
[target.'cfg(not(target_os = "android"))'.dependencies]
receiver-core = { path = "../crates/receiver-core" }

[target.'cfg(target_os = "android")'.dependencies]
receiver-core = { path = "../crates/receiver-core", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
