name: Android APK

# 個人用 Android アプリ (APK) を生成します。手動実行 (Actions タブ → Run workflow)
# か、android-v* タグの push で動きます。成果物は実行結果ページの Artifacts から
# ダウンロードできます。署名キーの扱いは docs/ANDROID.ja.md を参照してください。
on:
  workflow_dispatch:
    inputs:
      abi:
        description: "対象 ABI（ほとんどの現行スマホは aarch64）"
        type: choice
        default: aarch64
        options: [aarch64, armv7, x86_64, i686]
  push:
    tags: ["android-v*"]

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  ABI: ${{ inputs.abi || 'aarch64' }}
  NDK_VERSION: 27.2.12479018

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 既定の packages は "tools platform-tools" ですが、"tools" パッケージは
      # 配布が終了していて "Failed to find package 'tools'" で落ちます。
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK / NDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platform-tools" "ndk;${NDK_VERSION}"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.ABI == 'armv7' && 'armv7-linux-androideabi' || format('{0}-linux-android', env.ABI) }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: android-${{ env.ABI }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # SoapySDR を使わない構成です。入力は純 Rust の RTL-TCP のみ
      # (src-tauri/Cargo.toml が Android では default-features = false にします)。
      - name: Generate the Android project
        run: npx --yes @tauri-apps/cli@2 android init --ci

      # init が作る Gradle プロジェクトの compileSdk は Tauri CLI のバージョンで
      # 変わります (現行は 37)。生成された app/build.gradle.kts から読み取り、
      # その SDK プラットフォームと最新の build-tools を入れます。新しい Android は
      # "android-37" ではなく "android-37.0" のように小数付きの名前で配布される
      # ことがあるため、sdkmanager --list から実在する名前を探します。
      - name: Install the SDK platform the generated project needs
        run: |
          set -euo pipefail
          gradle_file=src-tauri/gen/android/app/build.gradle.kts
          compile_sdk="$(grep -oE 'compileSdk = [0-9]+' "$gradle_file" | grep -oE '[0-9]+' | head -n1)"
          test -n "$compile_sdk" || { echo "compileSdk not found in $gradle_file" >&2; exit 1; }

          sdkmanager --list 2>/dev/null | awk -F'|' '{gsub(/ /,"",$1); print $1}' | sort -u > "$RUNNER_TEMP/sdk-ids.txt"

          build_tools="$(grep -E '^build-tools;[0-9]+\.[0-9]+\.[0-9]+$' "$RUNNER_TEMP/sdk-ids.txt" | sort -V | tail -n1 || true)"
          platform="$(grep -E "^platforms;android-${compile_sdk}(\.[0-9]+)?$" "$RUNNER_TEMP/sdk-ids.txt" | sort -V | head -n1 || true)"
          echo "compileSdk=${compile_sdk} / platform='${platform}' / build-tools='${build_tools}'"

          if [ -z "$platform" ]; then
            echo "::warning::platforms;android-${compile_sdk} was not listed by sdkmanager; Gradle will try to download it itself."
            grep '^platforms;' "$RUNNER_TEMP/sdk-ids.txt" || true
          fi
          if [ -n "$build_tools" ]; then
            echo "BUILD_TOOLS=${build_tools#build-tools;}" >> "$GITHUB_ENV"
          else
            echo "::error::no build-tools were listed by sdkmanager"; exit 1
          fi
          sdkmanager --install ${platform:+"$platform"} "$build_tools"

      # GitHub のランナー (米国のデータセンター) から見た services.gradle.org は、
      # 手元の環境では問題なくても 504 を返すことがあります。まず公式 URL を
      # 間隔を空けて再試行し、それでも駄目なら GitHub 上の配布ミラーに切り替えます。
      - name: Prefetch Gradle (with retries and mirror fallback)
        working-directory: src-tauri/gen/android
        run: |
          chmod +x gradlew
          props=gradle/wrapper/gradle-wrapper.properties
          for attempt in 1 2 3; do
            if ./gradlew --version; then exit 0; fi
            echo "::warning::Gradle download failed (attempt ${attempt}/3); retrying"
            sleep $((attempt * 20))
          done
          version="$(grep -oE 'gradle-[0-9][0-9.]*-bin' "$props" | head -n1 | sed -E 's/^gradle-//; s/-bin$//')"
          echo "::warning::switching to the GitHub mirror for Gradle ${version}"
          sed -i -E "s#^distributionUrl=.*#distributionUrl=https\\://github.com/gradle/gradle-distributions/releases/download/v${version}/gradle-${version}-bin.zip#" "$props"
          grep '^distributionUrl' "$props"
          for attempt in 1 2 3; do
            if ./gradlew --version; then exit 0; fi
            sleep $((attempt * 20))
          done
          echo "::error::could not download Gradle" >&2
          exit 1

      # 失敗時は、Gradle が出した本当の原因 ("What went wrong" など) を抜き出して
      # ログ末尾と実行結果ページの Summary に載せます。全文は build.log として
      # Artifacts にも保存します。
      - name: Build the release APK
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/build.log"
          mkdir -p dist-logs
          if npx --yes @tauri-apps/cli@2 android build --apk --target "$ABI" --ci 2>&1 | tee "$log"; then
            exit 0
          fi
          cp "$log" dist-logs/build.log
          {
            echo '## Android build failed: Gradle / compiler messages'
            echo '```'
            awk '/FAILURE: Build failed|What went wrong|^> |^\* Where|error(\[E[0-9]+\])?:|Caused by|Could not|Execution failed|Exception/ {print}' "$log" | cut -c1-400 | head -n 80
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Upload the full build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: dist-logs/build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Sign the APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          bt="${ANDROID_HOME}/build-tools/${BUILD_TOOLS}"
          unsigned="$(find src-tauri/gen/android -path '*outputs/apk*' -path '*release*' -name '*.apk' | head -n1)"
          test -n "$unsigned" || { echo "release APK not found" >&2; exit 1; }
          keystore="$RUNNER_TEMP/release.keystore"
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$keystore"
            alias="${KEY_ALIAS:-key0}"
            password="$KEYSTORE_PASSWORD"
            note="登録済みのキーで署名しました。同じキーで署名した新しい版は上書きインストールできます。"
          else
            alias=key0
            password="$(openssl rand -hex 16)"
            keytool -genkeypair -keystore "$keystore" -storepass "$password" \
              -keypass "$password" -alias "$alias" -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=JR West Radio Receiver (personal)"
            note="一時キーで署名しました（毎回別のキー）。更新するときは先に古いアプリをアンインストールしてください。固定するには docs/ANDROID.ja.md のシークレット設定を行います。"
          fi
          "$bt/zipalign" -p -f 4 "$unsigned" "$RUNNER_TEMP/aligned.apk"
          mkdir -p dist
          "$bt/apksigner" sign --ks "$keystore" --ks-key-alias "$alias" \
            --ks-pass "pass:$password" --key-pass "pass:$password" \
            --out "dist/jr-west-radio-receiver-${ABI}.apk" "$RUNNER_TEMP/aligned.apk"
          "$bt/apksigner" verify --verbose "dist/jr-west-radio-receiver-${ABI}.apk"
          echo "$note" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: jr-west-radio-receiver-${{ env.ABI }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30
